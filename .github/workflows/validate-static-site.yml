name: Validate static learning site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'cryptography/**'
      - 'buck-5v/**'
      - 'learning-lab/**'
      - 'scripts/check_static_links.py'
      - '.github/workflows/validate-static-site.yml'
  pull_request:
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'cryptography/**'
      - 'buck-5v/**'
      - 'learning-lab/**'
      - 'scripts/check_static_links.py'
      - '.github/workflows/validate-static-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root site routes and assets
        run: python3 scripts/check_static_links.py .
